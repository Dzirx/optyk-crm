<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Optyk CRM</title>
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:Segoe UI,system-ui,sans-serif;background:#0f172a;color:#e2e8f0;user-select:none}
  h1{font-size:28px;margin:0 0 8px}
  p{margin:0;color:#94a3b8;font-size:14px}
  .bar{margin-top:28px;width:220px;height:4px;background:#1e293b;border-radius:2px;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#38bdf8;animation:m 1.2s infinite ease-in-out}
  @keyframes m{0%{margin-left:-40%}100%{margin-left:100%}}
</style></head>
<body><h1>Optyk CRM</h1><p>Uruchamianie aplikacji…</p><div class="bar"><i></i></div></body></html>
