<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Aktywacja — Optyk CRM</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #05060a radial-gradient(ellipse 80% 60% at 50% -10%, rgba(124, 58, 237, 0.28), transparent 70%);
      color: #fff; display: flex; align-items: center; justify-content: center; -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 420px; padding: 24px; }
    .logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px; font-weight: 600; font-size: 18px; }
    .ring { width: 30px; height: 30px; border-radius: 50%; padding: 2px; background: conic-gradient(#22d3ee, #a78bfa, #f472b6, #34d399, #22d3ee); }
    .ring span { display: flex; width: 100%; height: 100%; border-radius: 50%; background: #05060a; align-items: center; justify-content: center; }
    .ring span::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
    .card { border-radius: 24px; padding: 1px; background: linear-gradient(140deg, rgba(103,232,249,.35), rgba(196,181,253,.15) 35%, rgba(255,255,255,.06) 60%, rgba(249,168,212,.3)); }
    .inner { border-radius: 23px; background: rgba(10, 11, 18, .95); padding: 32px; }
    h1 { margin: 0; font-size: 22px; font-weight: 600; }
    p.lead { margin: 8px 0 24px; color: rgba(255,255,255,.55); font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 13px; color: rgba(255,255,255,.7); margin: 16px 0 8px; }
    input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: #fff; font: inherit; outline: none; }
    input::placeholder { color: rgba(255,255,255,.25); }
    input:focus { border-color: rgba(196,181,253,.5); box-shadow: 0 0 0 4px rgba(167,139,250,.1); }
    button { margin-top: 24px; width: 100%; padding: 13px; border: 0; border-radius: 999px; background: #fff; color: #05060a; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 0 40px rgba(167,139,250,.3); }
    button:disabled { opacity: .6; cursor: progress; }
    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.45; display: none; }
    .msg.error { display: block; border: 1px solid rgba(251,113,133,.3); background: rgba(251,113,133,.1); color: #ffe4e6; }
    .hint { margin-top: 20px; font-size: 12px; color: rgba(255,255,255,.4); text-align: center; line-height: 1.5; }
    a { color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><div class="ring"><span></span></div>OptykCRM</div>
    <div class="card"><div class="inner">
      <h1>Aktywacja programu</h1>
      <p class="lead">Zaloguj się kontem OptykCRM. Internet jest potrzebny tylko teraz — później program działa bez połączenia. Tych samych danych użyjesz do logowania w programie.</p>
      <form id="f">
        <label for="email">Adres e-mail</label>
        <input id="email" type="email" autocomplete="email" required placeholder="salon@example.pl" autofocus />
        <label for="password">Hasło</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        <div id="msg" class="msg" role="alert"></div>
        <button id="btn" type="submit">Aktywuj program</button>
      </form>
      <p class="hint">Licencja zostanie przypisana do tego komputera.<br />Problem z aktywacją? Skontaktuj się z nami.</p>
    </div></div>
  </div>
  <script>
    const f = document.getElementById('f');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      btn.disabled = true;
      btn.textContent = 'Aktywacja…';
      const r = await window.optyk.activate(document.getElementById('email').value, document.getElementById('password').value);
      if (r && r.ok) {
        btn.textContent = 'Aktywowano — uruchamianie…';
        return;
      }
      msg.textContent = (r && r.error) || 'Nie udało się aktywować programu.';
      msg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Aktywuj program';
    });
  </script>
</body>
</html>
